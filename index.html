<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرو لباس</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #0a0a0b; color: #eee; min-height: 100vh; }
        .upload-box {
            border: 2px dashed #333; border-radius: 16px; background: #141416;
            aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s;
        }
        .upload-box:hover { border-color: #e8762d; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .upload-box .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .upload-box:hover .overlay { opacity: 1; }
        .btn {
            background: linear-gradient(135deg, #e8762d, #c85a18); color: #fff;
            font-family: 'Vazirmatn'; font-weight: 800; font-size: 1.1rem;
            padding: 16px 48px; border: none; border-radius: 14px;
            cursor: pointer; transition: all 0.3s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(232,118,45,0.3); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .spinner { width: 48px; height: 48px; border: 3px solid #333; border-top-color: #e8762d; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-box { border: 1px solid #27272a; border-radius: 16px; background: #141416; overflow: hidden; }
        .result-box img { width: 100%; height: auto; display: block; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: #1c1c20; border: 1px solid #dc2626; color: #fca5a5;
            padding: 12px 24px; border-radius: 12px; font-size: 0.85rem;
            z-index: 9999; transition: transform 0.4s; text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: #16a34a; color: #86efac; }
    </style>
</head>
<body>

    <div style="max-width: 900px; margin: 0 auto; padding: 32px 16px;">

        <h1 style="text-align:center; margin-bottom: 8px;">
            <span style="color:#e8762d">پرو</span>لباس
        </h1>
        <p style="text-align:center; color:#666; margin-bottom: 40px; font-size: 0.9rem;">
            عکس قدی و لباس رو آپلود کن تا هوش مصنوعی لباس رو تن بت بپوشونه
        </p>

        <!-- آپلود -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px;">
            <div>
                <p style="margin-bottom: 8px; color: #888; font-size: 0.8rem;">
                    <i class="fas fa-user" style="color:#e8762d"></i> عکس قدی شما
                </p>
                <div class="upload-box" id="personBox" onclick="document.getElementById('personInput').click()">
                    <div id="personEmpty" style="text-align:center;">
                        <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:#555; margin-bottom:8px; display:block;"></i>
                        <span style="color:#555; font-size:0.8rem;">کلیک یا بکش و رها کن</span>
                    </div>
                    <img id="personImg" style="display:none;">
                    <div class="overlay"><span style="color:#fff; font-size:0.8rem;">تغییر عکس</span></div>
                </div>
                <input type="file" id="personInput" accept="image/*" style="display:none" onchange="handleUpload(this,'person')">
            </div>
            <div>
                <p style="margin-bottom: 8px; color: #888; font-size: 0.8rem;">
                    <i class="fas fa-tshirt" style="color:#e8762d"></i> عکس لباس
                </p>
                <div class="upload-box" id="clothBox" onclick="document.getElementById('clothInput').click()">
                    <div id="clothEmpty" style="text-align:center;">
                        <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:#555; margin-bottom:8px; display:block;"></i>
                        <span style="color:#555; font-size:0.8rem;">کلیک یا بکش و رها کن</span>
                    </div>
                    <img id="clothImg" style="display:none;">
                    <div class="overlay"><span style="color:#fff; font-size:0.8rem;">تغییر عکس</span></div>
                </div>
                <input type="file" id="clothInput" accept="image/*" style="display:none" onchange="handleUpload(this,'cloth')">
            </div>
        </div>

        <!-- دکمه -->
        <div style="text-align:center; margin-bottom: 32px;">
            <button class="btn" id="genBtn" disabled onclick="start()">
                <i class="fas fa-wand-magic-sparkles" style="margin-left:8px;"></i>ساخت تصویر
            </button>
            <p id="hint" style="color:#444; font-size:0.75rem; margin-top:8px;">ابتدا هر دو عکس را آپلود کنید</p>
        </div>

        <!-- لودینگ -->
        <div id="loading" style="display:none; text-align:center; padding: 40px;">
            <div class="spinner" style="margin: 0 auto 16px;"></div>
            <p id="status" style="color:#888; font-size:0.85rem;">...</p>
        </div>

        <!-- نتیجه -->
        <div id="result" style="display:none;">
            <p style="color:#888; font-size:0.8rem; margin-bottom:8px;">
                <i class="fas fa-check-circle" style="color:#e8762d"></i> نتیجه
            </p>
            <div class="result-box">
                <img id="resultImg" src="" alt="نتیجه">
            </div>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ===== متغیرها =====
        var personData = null;
        var clothData = null;

        // ===== آپلود عکس =====
        function handleUpload(input, type) {
            console.log('[آپلود] فایل انتخاب شد:', type, input.files[0].name);

            if (!input.files[0]) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                console.log('[آپلود] فایل خوانده شد برای:', type);

                if (type === 'person') {
                    personData = e.target.result;
                    document.getElementById('personImg').src = personData;
                    document.getElementById('personImg').style.display = 'block';
                    document.getElementById('personEmpty').style.display = 'none';
                } else {
                    clothData = e.target.result;
                    document.getElementById('clothImg').src = clothData;
                    document.getElementById('clothImg').style.display = 'block';
                    document.getElementById('clothEmpty').style.display = 'none';
                }
                updateButton();
            };
            reader.readAsDataURL(input.files[0]);
        }

        // ===== فعال/غیرفعال دکمه =====
        function updateButton() {
            var ready = personData && clothData;
            document.getElementById('genBtn').disabled = !ready;
            document.getElementById('hint').textContent = ready
                ? 'آماده‌ست!'
                : 'ابتدا هر دو عکس را آپلود کنید';
            console.log('[وضعیت] دکمه:', ready ? 'فعال' : 'غیرفعال');
        }

        // ===== جدا کردن base64 خالص از dataURL =====
        function getBase64(dataUrl) {
            var parts = dataUrl.split(',');
            var mime = 'image/png';
            var m = parts[0].match(/data:(image\/[a-z+]+);/i);
            if (m) mime = m[1];
            return { base64: parts[1], mime: mime };
        }

        // ===== ترکیب دو عکس کنار هم =====
        function combineImages(callback) {
            console.log('[ترکیب] شروع ترکیب دو عکس...');

            var img1 = new Image();
            var img2 = new Image();
            var loaded = 0;

            function done() {
                loaded++;
                if (loaded < 2) return;

                console.log('[ترکیب] هر دو عکس لود شدند');

                var w = Math.max(img1.width, img2.width);
                var h = Math.max(img1.height, img2.height);

                var canvas = document.createElement('canvas');
                canvas.width = w * 2 + 40;
                canvas.height = h + 50;
                var ctx = canvas.getContext('2d');

                // پس‌زمینه
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // عکس‌ها
                ctx.drawImage(img1, 0, 30, w, h);
                ctx.drawImage(img2, w + 40, 30, w, h);

                // برچسب‌ها
                ctx.fillStyle = '#e8762d';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PERSON', w / 2, 18);
                ctx.fillText('CLOTHING', w + 40 + w / 2, 18);

                var result = canvas.toDataURL('image/png');
                console.log('[ترکیب] ترکیب تکمیل شد — اندازه:', (result.length / 1024).toFixed(0), 'KB');
                callback(result);
            }

            img1.onload = done;
            img2.onload = done;
            img1.src = personData;
            img2.src = clothData;
        }

        // ===== شروع تولید =====
        function start() {
            if (!personData || !clothData) return;

            console.log('========================================');
            console.log('[شروع] تولید تصویر شروع شد');
            console.log('========================================');

            document.getElementById('genBtn').disabled = true;
            document.getElementById('result').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('status').textContent = 'آماده‌سازی تصاویر...';

            // مرحله ۱: ترکیب عکس‌ها
            combineImages(function(combined) {
                console.log('[مرحله ۱] ترکیب عکس‌ها — تکمیل');

                var data = getBase64(combined);
                console.log('[مرحله ۱] base64 استخراج شد — mime:', data.mime);

                // مرحله ۲: فرستادن به هوش مصنوعی
                document.getElementById('status').textContent = 'در حال تولید تصویر با هوش مصنوعی...';
                console.log('[مرحله ۲] ارسال درخواست به gemini-3.1-flash-image-preview...');

                var prompt = 'Virtual try-on task: This image shows TWO photos side by side. The LEFT photo labeled "PERSON" is a full-body photo of a person. The RIGHT photo labeled "CLOTHING" is a clothing item. Your task: Generate a NEW single image of that exact same person wearing that exact clothing item. Important rules: Keep the persons face, hair, skin color, body shape, pose, hands, and background completely IDENTICAL to the left photo. Only change the clothing to exactly match what is shown in the right photo (same color, type, cut, fabric, pattern, collar, sleeves, length, fit). Make it photorealistic with studio lighting. Show the full body. Output only the final try-on image.';

                puter.ai.txt2img(prompt, {
                    model: 'gemini-3.1-flash-image-preview',
                    input_image: data.base64,
                    input_image_mime_type: data.mime
                }).then(function(imgEl) {
                    console.log('[مرحله ۲] پاسخ دریافت شد:', imgEl ? imgEl.tagName : 'null');

                    if (imgEl && imgEl.tagName === 'IMG') {
                        console.log('[نتیجه] تصویر موفق — src:', imgEl.src.substring(0, 80) + '...');
                        document.getElementById('resultImg').src = imgEl.src;
                        document.getElementById('result').style.display = 'block';
                        showToast('تصویر با موفقیت ساخته شد', true);
                    } else {
                        console.log('[خطا] خروجی تصویر نبود:', imgEl);
                        showToast('خروجی تصویر نامعتبر بود');
                    }
                }).catch(function(err) {
                    console.log('[خطا] ارسال به API:', err.message || err);
                    showToast(err.message || 'خطای ناشناخته');
                }).finally(function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('genBtn').disabled = false;
                    console.log('[پایان] تولید تصویر تمام شد');
                });
            });
        }

        // ===== توست =====
        function showToast(msg, ok) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (ok ? ' ok' : '');
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 4000);
        }
    </script>
</body>
</html>
